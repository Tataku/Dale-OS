name: Bug / tooling problem
description: Report a deterministic tool, CLI, validation, adapter, install, or documentation defect.
title: "[bug] "
body:
  - type: input
    id: surface
    attributes:
      label: Surface
      placeholder: scripts/dale.py, Eve adapter, install, validator, docs...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python/Node version, host/agent runtime if relevant
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private account data, and other sensitive material from this report.
          required: true
