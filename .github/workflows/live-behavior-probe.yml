name: live-behavior-probe

# Paid, targeted verification after a narrow behavioral rule change.
# This intentionally avoids rerunning the full four-model matrix.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/live-model-verification-v0-1
    paths:
      - release/run-live-behavior-probe.txt

permissions:
  contents: read

jobs:
  terra-systemic-bug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Terra systemic-bug behavioral probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python scripts/run_live_behavior_probe.py
          --provider openai
          --role balanced
          --case-id systemic-bug-blast-radius
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dale-os-live-behavior-probe
          path: artifacts/live-behavior-probe/
          if-no-files-found: error
          retention-days: 30
