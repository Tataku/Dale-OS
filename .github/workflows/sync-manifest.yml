name: sync-manifest

on:
  push:
    branches:
      - agent/dale-os-final-verification-v0-6

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dale-os-final-verification-v0-6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_manifest.py
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already current"
            exit 0
          fi
          git commit -m "chore: sync generated manifest"
          git push origin HEAD:agent/dale-os-final-verification-v0-6
